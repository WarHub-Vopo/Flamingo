<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flamingo Theme Park</title>
    <style>
        :root {
            --pink: #ff2a85;
            --black: #0b0b0b;
            --dark-card: #4169e1;
            --gold: #d4af37;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--black);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            background-image: url('images/bg-main.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid var(--gold);
            position: relative;
        }

        header {
            padding: 3px;
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            background-color: rgba(65, 105, 225, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            max-height: 300px;
            width: auto;
            object-fit: contain;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .section-title {
            font-size: 18px;
            color: var(--pink);
            margin-bottom: 15px;
            border-left: 3px solid var(--pink);
            padding-left: 10px;
            background: rgba(0, 0, 0, 0.6);
            display: inline-block;
            padding-right: 10px;
            border-radius: 4px;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .card {
            position: relative;
            height: 130px;
            background-color: var(--dark-card);
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            overflow: hidden;
            border-width: 4px;
            border-style: solid;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
        }

        .card:hover {
            transform: translateY(-2px);
        }

        /* Vlastné ohraničenia a pulzujúci lesk pre jednotlivé tlačidlá */
        .card-zoo {
            border-color: #2ecc71;
            animation: borderGlowGreen 2.5s infinite ease-in-out;
        }
        .card-rides {
            border-color: #3498db;
            animation: borderGlowBlue 2.5s infinite ease-in-out;
        }
        .card-arcades {
            border-color: #d4af37;
            animation: borderGlowGold 2.5s infinite ease-in-out;
        }
        .card-games {
            border-color: #e74c3c;
            animation: borderGlowRed 2.5s infinite ease-in-out;
        }
        .card-food {
            border-color: #f1c40f;
            animation: borderGlowYellow 2.5s infinite ease-in-out;
        }
        .card-entertainment {
            border-color: #ff2a85;
            animation: borderGlowPink 2.5s infinite ease-in-out;
        }

        .card h3 {
            position: relative;
            z-index: 1;
            color: var(--white);
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            animation: shineEffect 2.5s infinite ease-in-out;
        }

        /* Animácia lesku textu */
        @keyframes shineEffect {
            0% {
                color: var(--white);
                text-shadow: 0 0 8px var(--gold), 0 0 20px var(--pink);
            }
            50% {
                color: #b0b0b0;
                text-shadow: none;
            }
            100% {
                color: var(--white);
                text-shadow: 0 0 8px var(--gold), 0 0 20px var(--pink);
            }
        }

        /* Animácie pulzovania pre orámovania jednotlivých tlačidiel */
        @keyframes borderGlowGreen {
            0% { border-color: #2ecc71; box-shadow: 0 0 8px rgba(46, 204, 113, 0.8); }
            50% { border-color: rgba(46, 204, 113, 0.3); box-shadow: none; }
            100% { border-color: #2ecc71; box-shadow: 0 0 8px rgba(46, 204, 113, 0.8); }
        }

        @keyframes borderGlowBlue {
            0% { border-color: #3498db; box-shadow: 0 0 8px rgba(52, 152, 219, 0.8); }
            50% { border-color: rgba(52, 152, 219, 0.3); box-shadow: none; }
            100% { border-color: #3498db; box-shadow: 0 0 8px rgba(52, 152, 219, 0.8); }
        }

        @keyframes borderGlowGold {
            0% { border-color: #d4af37; box-shadow: 0 0 8px rgba(212, 175, 55, 0.8); }
            50% { border-color: rgba(212, 175, 55, 0.3); box-shadow: none; }
            100% { border-color: #d4af37; box-shadow: 0 0 8px rgba(212, 175, 55, 0.8); }
        }

        @keyframes borderGlowRed {
            0% { border-color: #e74c3c; box-shadow: 0 0 8px rgba(231, 76, 60, 0.8); }
            50% { border-color: rgba(231, 76, 60, 0.3); box-shadow: none; }
            100% { border-color: #e74c3c; box-shadow: 0 0 8px rgba(231, 76, 60, 0.8); }
        }

        @keyframes borderGlowYellow {
            0% { border-color: #f1c40f; box-shadow: 0 0 8px rgba(241, 196, 15, 0.8); }
            50% { border-color: rgba(241, 196, 15, 0.3); box-shadow: none; }
            100% { border-color: #f1c40f; box-shadow: 0 0 8px rgba(241, 196, 15, 0.8); }
        }

        @keyframes borderGlowPink {
            0% { border-color: #ff2a85; box-shadow: 0 0 8px rgba(255, 42, 133, 0.8); }
            50% { border-color: rgba(255, 42, 133, 0.3); box-shadow: none; }
            100% { border-color: #ff2a85; box-shadow: 0 0 8px rgba(255, 42, 133, 0.8); }
        }

        nav {
            display: flex;
            justify-content: space-around;
            background-color: rgba(65, 105, 225, 0.9);
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            padding: 12px 0;
        }

        .nav-item {
            color: var(--white);
            font-size: 11px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--pink);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <img src="images/logo1.png" alt="Flamingo Logo" class="logo">
        </header>

        <div class="content">
            <h2 class="section-title">Attractions & Sections</h2>
            <div class="grid-menu">
                <div class="card card-zoo" onclick="openSection('Zoo')" style="background-image: url('images/zoo-bg.jpg');">
                    <h3 style="font-size: 50px;">Zoo</h3>
                </div>
                <div class="card card-rides" onclick="openSection('Rides')" style="background-image: url('images/rides-bg.jpg');">
                    <h3 style="font-size: 50px;">Rides</h3>
                </div>
                <div class="card card-arcades" onclick="openSection('Arcades')">
                    <h3>Arcades</h3>
                </div>
                <div class="card card-games" onclick="openSection('Games')">
                    <h3 style="font-size: 48px;">Games</h3>
                </div>
                <div class="card card-food" onclick="openSection('Food & Beverage')">
                    <h3>Food & Beverage</h3>
                </div>
                <div class="card card-entertainment" onclick="openSection('Entertainment')">
                    <h3>Entertainment</h3>
                </div>
            </div>
        </div>

        <nav>
            <div class="nav-item active" onclick="navigate('Home')">Home</div>
            <div class="nav-item" onclick="navigate('Map')">Map</div>
            <div class="nav-item" onclick="navigate('Tickets')">Tickets</div>
            <div class="nav-item" onclick="navigate('Profile')">Profile</div>
        </nav>
    </div>

    <script>
        function openSection(sectionName) {
            console.log("Opened section: " + sectionName);
            alert(`Welcome to section: ${sectionName}`);
        }

        function navigate(tabName) {
            console.log("Navigated to: " + tabName);
        }
    </script>
</body>
</html>
